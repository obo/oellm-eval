[project]
name = "oellm-eval"
version = "0.1.0"
description = "OpenEuroLLM Evaluation CLI"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pandas",
    "jsonargparse",
    "datasets<4.0.0",
    "rich",
    "huggingface_hub",
    "pyyaml",
    "oellm-tasks",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.1",
    "pytest-timeout>=2.3.1",
    "pre-commit",
]

[tool.uv.sources]
# By default, install oellm-tasks from its git repository (it is not on PyPI).
# For local development, the editable sibling checkout under ../oellm-tasks is
# used instead when installing with the "dev" dependency group
# (e.g. `uv sync --group dev`).
oellm-tasks = [
    { path = "../oellm-tasks", editable = true, group = "dev" },
    { git = "https://github.com/OpenEuroLLM/oellm-tasks.git" },
]

[dependency-groups]
dev = ["oellm-tasks"]

[project.scripts]
oellm-eval = "oellm.main:main"

[build-system]
requires = ["uv_build>=0.7.19,<0.8.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "oellm"
module-root = ""
include = ["oellm/resources/*", "oellm/resources/**/*"]

[tool.ruff]
line-length = 90
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
]
ignore = [
    "E501",  # line too long
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
    "W191",  # indentation contains tabs
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
